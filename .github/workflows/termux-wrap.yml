name: Build OpenCode for Termux (ARM64)

on:
  push:
    branches: [main, termux]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout OpenCode
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: dev
          path: opencode

      - name: Checkout bun-termux-loader
        uses: actions/checkout@v4
        with:
          repository: kaan-escober/bun-termux-loader
          path: bun-termux-loader

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply patches
        run: |
          cd opencode
          git apply ../patches/0001-android-support.patch || true
          bash ../scripts/termux-patch.sh ./opencode

      - name: Build OpenCode
        run: |
          cd opencode/packages/opencode
          bun install
          bun run script/build.ts --single --skip-install --skip-embed-web-ui

      - name: Verify Bun marker
        run: |
          BINARY="opencode/packages/opencode/dist/opencode-linux-arm64/bin/opencode"
          if ! strings "$BINARY" | grep -q "---- Bun! ----"; then
            echo "ERROR: Bun marker not found in binary!"
            exit 1
          fi
          echo "Bun marker verified."

      - name: Wrap binary
        run: |
          python3 bun-termux-loader/build.py \
            --input opencode/packages/opencode/dist/opencode-linux-arm64/bin/opencode \
            --output opencode-termux

      - name: Build .deb
        run: |
          bash scripts/package-deb.sh --binary opencode-termux --output opencode-termux.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-deb
          path: opencode-termux.deb
