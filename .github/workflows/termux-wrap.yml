name: Build OpenCode for Termux (ARM64)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenCode version to build'
        required: true
        default: '1.18.10'
        type: string
  push:
    branches: [main, termux]
  repository_dispatch:
    types: [opencode-release]

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          VER="${{ github.event.inputs.version }}"
          if [[ -z "$VER" ]]; then
            VER="${{ github.event.client_payload.version }}"
          fi
          if [[ -z "$VER" ]]; then
            # Fallback: read first VERSION= line from package-deb.sh
            VER=$(sed -n 's/^VERSION="\([^"]*\)".*/\1/p' scripts/package-deb.sh)
          fi
          if [[ -z "$VER" ]]; then
            echo "::error::Could not determine version"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building OpenCode v$VER"

      - name: Checkout OpenCode
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: v${{ steps.ver.outputs.version }}
          path: opencode

      - name: Checkout bun-termux-loader
        uses: actions/checkout@v4
        with:
          repository: Hope2333/bun-termux-loader
          path: bun-termux-loader

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Bump versions and apply patches
        run: |
          bash scripts/auto-patch.sh ./opencode ${{ steps.ver.outputs.version }}

      - name: Build OpenCode
        run: |
          cd opencode
          bun install
          cd packages/opencode
          bun run script/build.ts --single --skip-install --skip-embed-web-ui

      - name: Verify Bun marker
        run: |
          BINARY="opencode/packages/opencode/dist/opencode-linux-arm64/bin/opencode"
          if ! strings "$BINARY" | grep -F -- '---- Bun! ----' >/dev/null; then
            echo "::warning::Bun marker not found"
          else
            echo "Bun marker OK"
          fi

      - name: Wrap binary
        run: |
          cd bun-termux-loader
          python3 build.py             ../opencode/packages/opencode/dist/opencode-linux-arm64/bin/opencode             ../opencode-termux

      - name: Build .deb
        run: |
          bash scripts/package-deb.sh             --binary opencode-termux             --output opencode-termux.deb             --version ${{ steps.ver.outputs.version }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-v${{ steps.ver.outputs.version }}
          path: opencode-termux.deb

      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: OpenCode Termux v${{ steps.ver.outputs.version }}
          body: |
            Auto-patched build of OpenCode v${{ steps.ver.outputs.version }} for Termux.

            **Includes:**
            - Android OS support patch
            - Telemetry disabled
            - Single-file build (no code splitting)
            - Bun-termux-loader wrapped

            **Install:**
            ```bash
            dpkg -i opencode-termux.deb
            ```
          files: opencode-termux.deb
          draft: false
          prerelease: false
