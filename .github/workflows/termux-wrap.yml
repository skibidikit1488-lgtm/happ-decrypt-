name: Build OpenCode for Termux (ARM64)

on:
  push:
    branches: [main, termux]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Checkout OpenCode v1.18.9
        uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: v1.18.9
          path: opencode

      - name: Checkout bun-termux-loader (Hope2333 fork)
        uses: actions/checkout@v4
        with:
          repository: Hope2333/bun-termux-loader
          path: bun-termux-loader

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Apply patches
        run: |
          bash scripts/termux-patch.sh ./opencode

      - name: Build OpenCode
        run: |
          cd opencode
          bun install
          cd packages/opencode
          bun run script/build.ts --single --skip-install --skip-embed-web-ui

      - name: Verify Bun marker
        run: |
          BINARY="opencode/packages/opencode/dist/opencode-linux-arm64/bin/opencode"
          if ! strings "$BINARY" | grep -F -- '---- Bun! ----' >/dev/null; then
            echo "WARNING: Bun marker not found"
          else
            echo "Bun marker OK"
          fi

      - name: Wrap binary
        run: |
          cd bun-termux-loader
          python3 build.py \
            ../opencode/packages/opencode/dist/opencode-linux-arm64/bin/opencode \
            ../opencode-termux

      - name: Build .deb
        run: |
          bash scripts/package-deb.sh opencode-termux opencode-termux.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-termux-deb
          path: opencode-termux.deb
