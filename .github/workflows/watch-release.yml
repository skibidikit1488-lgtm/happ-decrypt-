name: Watch OpenCode Releases

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  workflows: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check_release.outputs.new_version }}
      should_build: ${{ steps.check_release.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Check latest OpenCode release
        id: check_release
        run: |
          LATEST=$(curl -sL             -H "Accept: application/vnd.github+json"             https://api.github.com/repos/anomalyco/opencode/releases/latest             | jq -r '.tag_name' | sed 's/^v//')

          echo "latest=$LATEST"

          CURRENT=$(sed -n 's/^VERSION="\([^"]*\)".*/\1/p' scripts/package-deb.sh || echo "0.0.0")
          echo "current=$CURRENT"

          if [[ "$LATEST" != "$CURRENT" ]]; then
            echo "new_version=$LATEST" >> "$GITHUB_OUTPUT"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "New version detected: $LATEST (was $CURRENT)"
          else
            echo "new_version=" >> "$GITHUB_OUTPUT"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "No new version. Current: $CURRENT"
          fi

  trigger:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trigger build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run termux-wrap.yml             --repo "${{ github.repository }}"             --ref main             -f "version=${{ needs.check.outputs.new_version }}"

      - name: Create tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const ver = '${{ needs.check.outputs.new_version }}';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔔 Auto-build triggered for OpenCode v${ver}`,
              body: `New OpenCode release **v${ver}** detected.\n\n- Build workflow triggered automatically.\n- If patches fail, this issue will be updated.\n- Assignee: @${context.repo.owner}`,
              labels: ['auto-build', 'pending']
              });
