name: Watch OpenCode Releases

on:
  schedule:
    - cron: '0 */6 * * *'   # каждые 6 часов
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.check.outputs.new_version }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Check latest OpenCode release
        id: check
        run: |
          # Получаем latest release через GitHub API
          LATEST=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/anomalyco/opencode/releases/latest \
            | jq -r '.tag_name' | sed 's/^v//')
          
          echo "latest=$LATEST"
          
          # Читаем текущую версию из нашего репо
          CURRENT=$(grep -oP 'VERSION=\"\K[^\"]+' scripts/package-deb.sh || echo "0.0.0")
          echo "current=$CURRENT"
          
          if [[ "$LATEST" != "$CURRENT" ]]; then
            echo "new_version=$LATEST" >> $GITHUB_OUTPUT
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "🚀 New version detected: $LATEST (was $CURRENT)"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "😴 No new version. Current: $CURRENT"
          fi

  trigger:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger build workflow
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: Build OpenCode for Termux
          ref: main
          inputs: |
            { "version": "${{ needs.check.outputs.new_version }}" }

      - name: Create tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const ver = '${{ needs.check.outputs.new_version }}';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔔 Auto-build triggered for OpenCode v${ver}`,
              body: `New OpenCode release **v${ver}** detected.\n\n- Build workflow triggered automatically.\n- If patches fail, this issue will be updated.\n- Assignee: @${context.repo.owner}`,
              labels: ['auto-build', 'pending']
           });
